[project]
name = "dictate"
version = "0.1.0"
description = "Hold-to-talk dictation for Windows: Right Alt, Whisper, paste at the cursor."
readme = "README.md"
authors = [
    { name = "BhavikaGouri", email = "bhavikagouri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
dictate = "dictate.__main__:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
